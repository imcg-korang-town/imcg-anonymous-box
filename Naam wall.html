<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wall - CBS Awaz Box</title>
<style>
  body{font-family:'Segoe UI',Arial;background:#121212;color:#e0e0e0;margin:0;padding:20px}
  .container{max-width:800px;margin:auto}
  h2{text-align:center;color:#fff}
  .card{background:#1e1e1e;border:1px solid #2a2a2a;border-radius:12px;padding:20px;margin:15px 0}
  .card p{color:#bdbdbd;line-height:1.6}
  .date{font-size:11px;color:#616161;margin-top:10px}
</style>
</head>
<body>
<div class="container">
  <h2>CBS - MASLON KI DEEWAR</h2>
  <p style="text-align:center;color:#757575;font-size:13px;">Yahan sab ke anonymous maslay show honge</p>
  
  <div class="card">
    <p>Example: Canteen ka pani saaf nahi hai, please check karen.</p>
    <div class="date">Anonymous - 2 hours ago</div>
  </div>

  <div class="card">
    <p>Example: Library me books purani hain, new edition chahiye.</p>
    <div class="date">Anonymous - 5 hours ago</div>
  </div>
</div>
</body>
</html>
