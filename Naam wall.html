<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naam Wall - CBS</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f9f6f2] min-h-screen flex items-center justify-center p-4">

<div class="bg-white max-w-md w-full rounded-[30px] p-8 shadow-xl">
  <h1 class="text-2xl font-bold text-center">Naam Wall ✨</h1>
  <p class="text-center text-gray-500 text-sm mt-2">Apna naam chupke se bhejo</p>
  
  <input id="naam" type="text" placeholder="Naam yahan likho..." 
  class="w-full mt-6 p-4 bg-gray-50 rounded-2xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-black" />
  
  <button id="btn2" class="w-full mt-4 bg-black text-white py-4 rounded-2xl font-semibold">
    Bhejo
  </button>
  
  <p id="status2" class="text-center mt-4 text-sm"></p>
</div>

<script>
const btn = document.getElementById('btn2');
const naamInput = document.getElementById('naam');
const status = document.getElementById('status2');

btn.addEventListener('click', async () => {
  const naam = naamInput.value.trim();
  if(!naam){
    status.textContent = "Naam to likho...";
    status.className = "text-center mt-4 text-sm text-red-500";
    return;
  }

  btn.textContent = "Sending...";
  btn.disabled = true;

  const formData = {
    access_key: "3373bc4d-9512-4846-a240-2b0584d320df",
    subject: "New Naam Wall Entry",
    message: `Naam Wall pe naya naam: ${naam}`,
    from_name: "Naam Wall"
  };

  try {
    const res = await fetch("https://api.web3forms.com/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(formData)
    });
    const data = await res.json();
    if(data.success){
      status.textContent = "✅ Naam chala gaya!";
      status.className = "text-center mt-4 text-sm text-green-600";
      naamInput.value = "";
    } else { throw new Error(); }
  } catch(e){
    status.textContent = "❌ Error, dubara try karo";
    status.className = "text-center mt-4 text-sm text-red-500";
  }
  btn.textContent = "Bhejo";
  btn.disabled = false;
});
</script>

</body>
</html>
