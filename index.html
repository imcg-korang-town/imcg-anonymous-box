<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBS - Awaz Box</title>
<style>
  body { 
    font-family: 'Segoe UI', Arial, sans-serif; 
    background: #121212; 
    color: #e0e0e0;
    display: flex; 
    justify-content: center; 
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px; 
  }
  .box { 
    background: #1e1e1e; 
    padding: 35px; 
    border-radius: 16px; 
    max-width: 500px; 
    width: 100%; 
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    border: 1px solid #2a2a2a;
  }
  h2 { color: #ffffff; text-align: center; letter-spacing: 1px; margin-bottom: 5px; }
  .subtitle { color: #9e9e9e; font-size: 13px; text-align: center; margin-bottom: 25px; letter-spacing: 0.5px; }
  textarea { 
    width: 100%; 
    height: 160px; 
    padding: 15px; 
    background: #2a2a2a;
    color: #ffffff;
    border: 1px solid #3a3a3a; 
    border-radius: 10px; 
    font-size: 15px; 
    margin: 15px 0; 
    resize: none;
    outline: none;
  }
  textarea:focus { border-color: #757575; }
  textarea::placeholder { color: #757575; }
  button { 
    width: 100%; 
    padding: 14px; 
    background: linear-gradient(145deg, #424242, #212121); 
    color: white; 
    border: 1px solid #424242; 
    border-radius: 10px; 
    font-size: 16px; 
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer; 
    transition: 0.3s;
  }
  button:hover { background: #424242; transform: translateY(-1px); }
  #msg { text-align: center; margin-top: 20px; font-weight: bold; font-size: 14px; }
  .footer { text-align: center; margin-top: 20px; font-size: 11px; color: #616161; }
</style>
</head>
<body>
<div class="box">
  <h2>CBS - AWAZ BOX</h2>
  <div class="subtitle">100% ANONYMOUS & SECURE</div>
  <textarea id="problem" placeholder="Apna masla yahan likhen... naam / class likhne ki zarurat nahi"></textarea>
  <button onclick="submitProblem()">SEND ANONYMOUSLY</button>
  <div id="msg"></div>
  <div class="footer">IMCG Students Welfare Initiative</div>
</div>

<script>
function submitProblem() {
  let text = document.getElementById('problem').value;
  let msg = document.getElementById('msg');
  if(text.trim() == "") {
    msg.innerText = "Please pehle masla likhen.";
    msg.style.color = "#ef5350";
    return;
  }
  msg.innerText = "Shukriya! Apka masla mehfooz ho gaya hai.";
  msg.style.color = "#9e9e9e";
  document.getElementById('problem').value = "";
}
</script>
</body>
</html>
